---
- name: настройка локальной веб-среды
  hosts: local
  become: true

  tasks:
    - name: установка пакета nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: создание пользовательской веб-страницы
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Инфраструктура настроена через Ansible (IaC)</h1>\n"
        owner: root
        group: root
        mode: "0644"

    - name: запуск и включение службы nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
