
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ansible Lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 ansible-lint

      - name: Run Ansible Lint
        run: ansible-lint ansible_iac/setup_env.yml

